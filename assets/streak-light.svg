<svg xmlns="http://www.w3.org/2000/svg" width="460" height="200" viewBox="0 0 460 200" role="img" aria-label="GitHub contribution streak for TschangoMP">
  <title>GitHub contribution streak for TschangoMP</title>
  <style>
    text { font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Helvetica, Arial, sans-serif; }
    .title { font-size: 16px; font-weight: 600; fill: #1f2328; }
    .label { font-size: 13px; fill: #59636e; }
    .value { font-size: 13px; font-weight: 600; fill: #1f2328; }
    .big { font-size: 28px; font-weight: 700; fill: #1f2328; }
    .big-accent { font-size: 28px; font-weight: 700; fill: #bf3989; }
    .small { font-size: 11px; fill: #59636e; }
  </style>
  <rect x="0.5" y="0.5" width="459" height="199" rx="8" fill="#ffffff" stroke="#d0d7de"/>
  <text x="24" y="36" class="title">Contribution streak</text>
  <text x="92.7" y="104" class="big" text-anchor="middle">7</text>
  <text x="92.7" y="132" class="label" text-anchor="middle">Contributions</text>
  <text x="92.7" y="152" class="small" text-anchor="middle">Since 2022</text>
  <text x="230.0" y="104" class="big-accent" text-anchor="middle">0</text>
  <text x="230.0" y="132" class="label" text-anchor="middle">Current streak</text>
  <text x="230.0" y="152" class="small" text-anchor="middle">No active streak</text>
  <line x1="161.3" y1="72" x2="161.3" y2="160" stroke="#d0d7de"/>
  <text x="367.3" y="104" class="big" text-anchor="middle">1</text>
  <text x="367.3" y="132" class="label" text-anchor="middle">Longest streak</text>
  <text x="367.3" y="152" class="small" text-anchor="middle">Aug 25, 2022</text>
  <line x1="298.7" y1="72" x2="298.7" y2="160" stroke="#d0d7de"/>
</svg>
