name: Update profile stats

on:
  schedule:
    - cron: "23 4 * * *" # daily, 04:23 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/scripts/generate_stats.py"
      - ".github/workflows/profile-stats.yml"

permissions:
  contents: write

concurrency:
  group: profile-stats
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Generate SVG cards
        env:
          # Optional: add a STATS_TOKEN secret (classic PAT with read:user + repo)
          # to include private contributions. Falls back to the built-in token.
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/generate_stats.py --login "${{ github.repository_owner }}" --out assets

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain -- assets)" ]; then
            echo "Stats unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git commit -m "Update profile stats [skip ci]"
          git push
